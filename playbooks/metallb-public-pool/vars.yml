---
# Example MetalLB public-pool configuration.
# Copy this file for each cluster and pass it with:
#   ansible-playbook metallb-public-pool.yml -e @/path/to/cluster-vars.yml
#
# Replace all example values below before running the playbook.

# OpenStack cloud name from clouds.yaml.
os_cloud: example-undercloud

# Existing management VLAN used to discover the physical trunk parent.
mgmt_vlan_id: 109
mgmt_interface: "mgmt.{{ mgmt_vlan_id }}"

# One node may participate in multiple pools. Pool names, interface names,
# VLANs, route tables, and policy-rule priorities must be unique.
metallb_public_pools:
  - name: public-pool
    vlan_id: 105
    subnet: "192.0.2.0/28"
    gateway: "192.0.2.1"

    # Optional overrides and their defaults:
    # interface_name: "metal.105"   # metal.<vlan_id>
    # table_id: 105                 # <vlan_id>
    # rule_priority: 1105           # 1000 + <vlan_id>
    # parent_interface: eno1        # discovered parent of mgmt_interface
    # mtu: 9000                     # discovered trunk-parent MTU

    # Hosts must match entries in the oc_controlplane_nodes or oc_worker_nodes
    # inventory groups. Ports may be OpenStack port names or UUIDs and must
    # already exist as trunk subports.
    node_ports:
      - host: example-cp0
        port: example-cp0-public-pool
      - host: example-cp1
        port: example-cp1-public-pool
      - host: example-wn0
        port: example-wn0-public-pool

# Add more pool mappings under metallb_public_pools as needed.
