---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-rbd
  namespace: ceph-csi
spec:
  releaseName: ceph-csi-rbd
  interval: 5m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  targetNamespace: ceph-csi
  chart:
    spec:
      chart: ceph-csi-rbd
      version: 3.17.0
      sourceRef:
        kind: HelmRepository
        name: ceph-csi
        namespace: ceph-csi
  valuesFrom:
    - kind: Secret
      name: ceph-csi-rbd-values-base
      valuesKey: values.yaml
    - kind: Secret
      name: ceph-csi-rbd-values-override
      valuesKey: override.yaml
      optional: true
