apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease.yaml
secretGenerator:
    - name: triton-inference-server-values-base
      namespace: triton-inference-server
      type: Opaque
      files:
        - values.yaml=helm-values/values-v2.69.0.yaml
      options:
        disableNameSuffixHash: true
