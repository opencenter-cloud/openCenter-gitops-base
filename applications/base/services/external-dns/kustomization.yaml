apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease.yaml
secretGenerator:
    - name: external-dns-values-base
      namespace: external-dns
      type: Opaque
      files:
        - values.yaml=helm-values/values-1.20.0.yaml
      options:
        disableNameSuffixHash: true
