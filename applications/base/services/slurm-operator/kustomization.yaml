apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease-crds.yaml
    - helmrelease.yaml
secretGenerator:
    - name: slurm-operator-values-base
      namespace: slinky
      type: Opaque
      files:
        - values.yaml=helm-values/values-v1.1.1.yaml
      options:
        disableNameSuffixHash: true
