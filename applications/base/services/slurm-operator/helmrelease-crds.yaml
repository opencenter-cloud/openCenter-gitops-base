apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slurm-operator-crds
  namespace: slinky
spec:
  releaseName: slurm-operator-crds
  interval: 5m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  chart:
    spec:
      chart: slurm-operator-crds
      version: v1.1.1
      sourceRef:
        kind: HelmRepository
        name: slinkyproject
        namespace: slinky
