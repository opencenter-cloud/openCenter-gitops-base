---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nodelocaldns
  namespace: nodelocaldns
spec:
  releaseName: nodelocaldns
  interval: 5m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  targetNamespace: nodelocaldns
  chart:
    spec:
      chart: node-local-dns
      version: 2.4.0
      sourceRef:
        kind: HelmRepository
        name: nodelocaldns
        namespace: nodelocaldns
  valuesFrom:
    - kind: Secret
      name: nodelocaldns-values-base
      valuesKey: values.yaml
    - kind: Secret
      name: nodelocaldns-values-override
      valuesKey: override.yaml
      optional: true
