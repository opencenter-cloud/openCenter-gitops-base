---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-resources
  namespace: kserve
spec:
  releaseName: kserve-resources
  interval: 5m
  timeout: 10m
  driftDetection:
    mode: enabled
  dependsOn:
    - name: kserve-crd
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  targetNamespace: kserve
  chart:
    spec:
      chart: kserve-resources
      version: v0.18.0
      sourceRef:
        kind: HelmRepository
        name: kserve
        namespace: kserve
  valuesFrom:
    - kind: Secret
      name: kserve-values-base
      valuesKey: values.yaml
    - kind: Secret
      name: kserve-values-override
      valuesKey: override.yaml
      optional: true
