apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease-crd.yaml
    - helmrelease.yaml
secretGenerator:
    - name: kserve-values-base
      namespace: kserve
      type: Opaque
      files:
        - values.yaml=helm-values/values-v0.18.0.yaml
      options:
        disableNameSuffixHash: true
