---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-crd
  namespace: kserve
spec:
  releaseName: kserve-crd
  interval: 5m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  targetNamespace: kserve
  chart:
    spec:
      chart: kserve-crd
      version: v0.18.0
      sourceRef:
        kind: HelmRepository
        name: kserve
        namespace: kserve
