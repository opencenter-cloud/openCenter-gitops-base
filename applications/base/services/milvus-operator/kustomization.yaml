apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease.yaml
secretGenerator:
    - name: milvus-operator-values-base
      namespace: milvus-operator
      type: Opaque
      files:
        - values.yaml=helm-values/values-1.3.7.yaml
      options:
        disableNameSuffixHash: true
