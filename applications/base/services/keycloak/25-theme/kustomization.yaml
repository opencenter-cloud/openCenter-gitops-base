---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
# Pulls in the base Keycloak CR from the sibling 20-keycloak stage so the theme
# mount patch below can be applied to it; `kustomize build` on this stage then
# emits the fully-patched Keycloak CR together with the theme ConfigMaps and the
# realm login-theme import.
resources:
  - "../20-keycloak"
  - "configmap-login.yaml"
  - "configmap-css.yaml"
  - "configmap-img.yaml"
  - "realm-login-theme.yaml"
patches:
  - path: "keycloak-cr-theme-patch.yaml"
    target:
      group: k8s.keycloak.org
      version: v2alpha1
      kind: Keycloak
      name: keycloak
