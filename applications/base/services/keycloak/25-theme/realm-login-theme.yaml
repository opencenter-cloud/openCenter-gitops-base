# Theme-activation seam (deliberate Path-2 choice).
#
# The base service normally leaves realm/client config cluster-specific
# (see docs/operations/services/keycloak.md). This MINIMAL realm import exists
# only to switch the realm's login theme to the mounted `opencenter` theme.
# It intentionally does NOT define users, groups, or clients — those remain
# cluster-specific and are layered by the consuming cluster/enterprise repo.
#
# A cluster repo that bootstraps the opencenter realm itself should set
# `loginTheme: opencenter` in its own realm import instead of relying on this one.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: opencenter-login-theme
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm:
    realm: opencenter
    enabled: true
    loginTheme: opencenter
