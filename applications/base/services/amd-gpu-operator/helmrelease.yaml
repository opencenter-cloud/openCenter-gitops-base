apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-gpu-operator
  namespace: kube-amd-gpu
spec:
  releaseName: amd-gpu-operator
  interval: 5m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  targetNamespace: kube-amd-gpu
  chart:
    spec:
      chart: gpu-operator-charts
      version: v1.5.0
      sourceRef:
        kind: HelmRepository
        name: rocm
        namespace: kube-amd-gpu
  valuesFrom:
    - kind: Secret
      name: amd-gpu-operator-values-base
      valuesKey: values.yaml
    - kind: Secret
      name: amd-gpu-operator-values-override
      valuesKey: override.yaml
      optional: true
