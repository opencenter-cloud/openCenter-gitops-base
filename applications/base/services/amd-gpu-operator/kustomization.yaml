apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease.yaml
secretGenerator:
    - name: amd-gpu-operator-values-base
      namespace: kube-amd-gpu
      type: Opaque
      files:
        - values.yaml=helm-values/values-v1.5.0.yaml
      options:
        disableNameSuffixHash: true
