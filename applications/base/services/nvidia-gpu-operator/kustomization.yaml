apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease.yaml
secretGenerator:
    - name: gpu-operator-values-base
      namespace: gpu-operator
      type: Opaque
      files:
        - values.yaml=helm-values/values-v26.3.2.yaml
      options:
        disableNameSuffixHash: true
