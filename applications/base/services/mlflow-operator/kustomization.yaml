apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease.yaml
secretGenerator:
    - name: mlflow-operator-values-base
      namespace: opendatahub
      type: Opaque
      files:
        - values.yaml=helm-values/values-1.1.0.yaml
      options:
        disableNameSuffixHash: true
