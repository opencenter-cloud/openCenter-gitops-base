apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease.yaml
secretGenerator:
    - name: envoy-gateway-api-values-base
      namespace: envoy-gateway-system
      type: Opaque
      files:
        - values.yaml=helm-values/values-v1.9.2.yaml
      options:
        disableNameSuffixHash: true
