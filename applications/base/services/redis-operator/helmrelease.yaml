---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: redis-operator
spec:
  releaseName: redis-operator
  interval: 5m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  targetNamespace: redis-operator
  chart:
    spec:
      chart: redis-operator
      version: 0.25.0
      sourceRef:
        kind: HelmRepository
        name: redis-operator
        namespace: redis-operator
  valuesFrom:
    - kind: Secret
      name: redis-operator-values-base
      valuesKey: values.yaml
    - kind: Secret
      name: redis-operator-values-override
      valuesKey: override.yaml
      optional: true
