---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-ovn
  namespace: kube-system
spec:
  releaseName: kube-ovn
  interval: 5m
  timeout: 15m
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  targetNamespace: kube-system
  chart:
    spec:
      chart: kube-ovn
      version: v1.16.2
      sourceRef:
        kind: HelmRepository
        name: kubeovn
        namespace: kube-system
  valuesFrom:
    - kind: Secret
      name: kube-ovn-values-base
      valuesKey: values.yaml
    - kind: Secret
      name: kube-ovn-values-override
      valuesKey: override.yaml
      optional: true
