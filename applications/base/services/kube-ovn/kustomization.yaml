apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease.yaml
secretGenerator:
    - name: kube-ovn-values-base
      namespace: kube-system
      type: Opaque
      files:
        - values.yaml=helm-values/values-v1.16.2.yaml
      options:
        disableNameSuffixHash: true
