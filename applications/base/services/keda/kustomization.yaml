apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - source.yaml
  - helmrelease.yaml
secretGenerator:
  - name: keda-values-base
    namespace: keda
    type: Opaque
    files:
      - values.yaml=helm-values/values-2.21.0.yaml
    options:
      disableNameSuffixHash: true
