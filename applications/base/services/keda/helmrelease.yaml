---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  releaseName: keda
  interval: 5m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  targetNamespace: keda
  chart:
    spec:
      chart: keda
      version: 2.21.0
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: keda
  valuesFrom:
    - kind: Secret
      name: keda-values-base
      valuesKey: values.yaml
    - kind: Secret
      name: keda-values-override
      valuesKey: override.yaml
      optional: true
