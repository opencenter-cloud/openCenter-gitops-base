apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - source.yaml
  - helmrelease.yaml
secretGenerator:
  - name: weave-gitops-values-base
    namespace: flux-system
    type: Opaque
    files:
      - values.yaml=helm-values/values-4.0.36.yaml
    options:
      disableNameSuffixHash: true
