apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease.yaml
secretGenerator:
    - name: vllm-values-base
      namespace: vllm
      type: Opaque
      files:
        - values.yaml=helm-values/values-0.1.11.yaml
      options:
        disableNameSuffixHash: true
