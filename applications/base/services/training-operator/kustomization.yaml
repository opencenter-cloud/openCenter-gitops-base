apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - namespace.yaml
    - source.yaml
    - helmrelease.yaml
secretGenerator:
    - name: training-operator-values-base
      namespace: kubeflow-system
      type: Opaque
      files:
        - values.yaml=helm-values/values-0.0.1.yaml
      options:
        disableNameSuffixHash: true
