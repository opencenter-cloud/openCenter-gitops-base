---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calico
  namespace: tigera-operator
spec:
  releaseName: calico
  interval: 5m
  timeout: 10m
  driftDetection:
    mode: enabled
  dependsOn:
    - name: calico-crds
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  targetNamespace: tigera-operator
  chart:
    spec:
      chart: tigera-operator
      version: v3.32.0
      sourceRef:
        kind: HelmRepository
        name: projectcalico
        namespace: tigera-operator
  valuesFrom:
    - kind: Secret
      name: calico-values-base
      valuesKey: values.yaml
    - kind: Secret
      name: calico-values-override
      valuesKey: override.yaml
      optional: true
