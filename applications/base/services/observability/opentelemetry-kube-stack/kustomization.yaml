apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
secretGenerator:
  - name: opentelemetry-kube-stack-values-base
    namespace: observability
    type: Opaque
    files:
      - values.yaml=helm-values/values-0.23.0.yaml
    options:
      disableNameSuffixHash: true
