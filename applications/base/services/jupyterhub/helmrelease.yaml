---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jupyterhub
  namespace: jupyterhub
spec:
  releaseName: jupyterhub
  interval: 5m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  targetNamespace: jupyterhub
  chart:
    spec:
      chart: jupyterhub
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: jupyterhub
        namespace: jupyterhub
  valuesFrom:
    - kind: Secret
      name: jupyterhub-values-base
      valuesKey: values.yaml
    - kind: Secret
      name: jupyterhub-values-override
      valuesKey: override.yaml
      optional: true
