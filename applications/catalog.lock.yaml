blueprints:
  - apiVersion: catalog.opencenter.dev/v1alpha1
    kind: Blueprint
    name: ai-ml
    title: AI/ML
    description: Full machine learning and GenAI platform. Includes model training, inference serving,
      experiment tracking, feature stores, vector databases, notebook environments, job scheduling, and
      HPC workload management.
    extends: enterprise
    members:
      - cert-manager
      - metallb
      - sealed-secrets
      - nodelocaldns
      - external-snapshotter
      - longhorn
      - gateway-api
      - observability/kube-prometheus-stack
      - external-dns
      - keycloak
      - istio
      - harbor
      - kyverno
      - rbac-manager
      - velero
      - headlamp
      - olm
      - postgres-operator
      - redis-operator
      - strimzi-kafka-operator
      - kured
      - observability/loki
      - observability/mimir
      - observability/tempo
      - observability/opentelemetry-kube-stack
      - nvidia-gpu-operator
      - amd-gpu-operator
      - node-feature-discovery
      - kueue
      - kuberay-operator
      - training-operator
      - kserve
      - triton-inference-server
      - vllm
      - mlflow-operator
      - model-registry-operator
      - data-science-pipelines-operator
      - feast-operator
      - trustyai-service-operator
      - milvus-operator
      - jupyterhub
      - slurm-operator
    choices:
      - &id001
        name: cni
        description: CNI
        oneOf:
          - cilium
          - calico
          - kube-ovn
      - name: gpu-vendor
        description: GPU vendor (select per hardware fleet)
        oneOf:
          - nvidia-gpu-operator
          - amd-gpu-operator
  - apiVersion: catalog.opencenter.dev/v1alpha1
    kind: Blueprint
    name: cloud-provider-integration
    title: Cloud Provider Integration
    description: Infrastructure-specific integrations. Deploy based on target cloud/hypervisor.
    members:
      - openstack-ccm
      - openstack-csi
      - vsphere-csi
      - metallb
  - apiVersion: catalog.opencenter.dev/v1alpha1
    kind: Blueprint
    name: data-messaging
    title: Data & Messaging
    description: Databases, caches, message brokers, and feature stores.
    members:
      - postgres-operator
      - redis-operator
      - strimzi-kafka-operator
      - milvus-operator
      - feast-operator
  - apiVersion: catalog.opencenter.dev/v1alpha1
    kind: Blueprint
    name: enterprise
    title: Enterprise
    description: Production-hardened cluster. Adds identity management, policy enforcement, service mesh,
      container registry, backup/DR, RBAC automation, full observability stack, and database management.
    extends: minimal
    members:
      - cert-manager
      - metallb
      - sealed-secrets
      - nodelocaldns
      - external-snapshotter
      - longhorn
      - gateway-api
      - observability/kube-prometheus-stack
      - external-dns
      - keycloak
      - istio
      - harbor
      - kyverno
      - rbac-manager
      - velero
      - headlamp
      - olm
      - postgres-operator
      - redis-operator
      - strimzi-kafka-operator
      - kured
      - observability/loki
      - observability/mimir
      - observability/tempo
      - observability/opentelemetry-kube-stack
    choices:
      - *id001
  - apiVersion: catalog.opencenter.dev/v1alpha1
    kind: Blueprint
    name: hpc-batch
    title: HPC & Batch
    description: High-performance computing and batch job scheduling.
    members:
      - slurm-operator
      - kueue
      - training-operator
      - kuberay-operator
  - apiVersion: catalog.opencenter.dev/v1alpha1
    kind: Blueprint
    name: minimal
    title: Minimal
    description: The smallest viable cluster. Provides networking, certificate management, storage, secrets,
      DNS, and basic observability. Enough to run stateless and stateful workloads with TLS.
    members:
      - cert-manager
      - metallb
      - sealed-secrets
      - nodelocaldns
      - external-snapshotter
      - longhorn
      - gateway-api
      - observability/kube-prometheus-stack
    choices:
      - *id001
  - apiVersion: catalog.opencenter.dev/v1alpha1
    kind: Blueprint
    name: networking
    title: Networking
    description: CNI plugins and network infrastructure services. CNI is mutually exclusive — deploy exactly
      one.
    members:
      - metallb
      - gateway-api
      - istio
      - nodelocaldns
      - external-dns
    choices:
      - name: cni
        description: CNI (mutually exclusive)
        oneOf:
          - cilium
          - calico
          - kube-ovn
  - apiVersion: catalog.opencenter.dev/v1alpha1
    kind: Blueprint
    name: observability
    title: Observability
    description: Full-stack monitoring, logging, tracing, and telemetry collection.
    members:
      - observability/kube-prometheus-stack
      - observability/loki
      - observability/mimir
      - observability/tempo
      - observability/opentelemetry-kube-stack
  - apiVersion: catalog.opencenter.dev/v1alpha1
    kind: Blueprint
    name: operator-infrastructure
    title: Operator Infrastructure
    description: Services that manage other operators and their lifecycle.
    members:
      - olm
      - node-feature-discovery
  - apiVersion: catalog.opencenter.dev/v1alpha1
    kind: Blueprint
    name: security-policy
    title: Security & Policy
    description: Identity, secrets, access control, and policy enforcement.
    members:
      - keycloak
      - sealed-secrets
      - kyverno
      - rbac-manager
      - cert-manager
      - trustyai-service-operator
  - apiVersion: catalog.opencenter.dev/v1alpha1
    kind: Blueprint
    name: storage
    title: Storage
    description: Persistent storage drivers and volume management. Choose based on infrastructure (bare-metal,
      OpenStack, vSphere, Ceph).
    members:
      - longhorn
      - ceph-csi
      - openstack-csi
      - vsphere-csi
      - external-snapshotter
      - local-path-provisioner
